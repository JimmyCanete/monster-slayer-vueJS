<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue Basics</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <!-- Vue 3 - Global Build -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>

    <!-- App -->
    <script src="app.js" defer></script>
  </head>

  <body>
    <header>
      <h1>Monster Slayer</h1>
    </header>

    <div id="game">
      <!-- MONSTER -->
      <section id="monster" class="container">
        <h2>Monster Health</h2>
        <div class="healthbar">
          <div class="healthbar__value" :style="monsterBarStyles"></div>
        </div>
      </section>

      <!-- PLAYER -->
      <section id="player" class="container">
        <h2>Your Health</h2>
        <div class="healthbar">
          <div class="healthbar__value" :style="playerBarStyles"></div>
        </div>
      </section>

      <!-- GAME OVER -->
      <section class="container" v-if="winner">
        <h2>Game Over!</h2>

        <h3 v-if="winner === 'monster'">You Lost!</h3>
        <h3 v-else-if="winner === 'player'">You Won!</h3>
        <h3 v-else>It's a Draw!</h3>

        <p>{{ currentRound }} rounds</p>

        <button @click="startGame">New Game</button>
      </section>

      <!-- CONTROLS -->
      <section id="controls" v-if="!winner">
        <button @click="attackMonster">ATTACK</button>
        <button
          @click="specialAttackMonster"
          :disabled="specialAttackCooldown"
        >
          SPECIAL ATTACK
        </button>
        <button @click="healPlayer">HEAL</button>
        <button @click="surrender">SURRENDER</button>
      </section>

      <!-- LOG -->
      <section id="log" class="container">
        <h2>Battle Log</h2>
        <ul>
          <li
            v-for="(logMessage, index) in logMessages"
            :key="index"
          >
            <span
              :class="{
                'log--player': logMessage.actionBy === 'player',
                'log--monster': logMessage.actionBy === 'monster'
              }"
            >
              {{ logMessage.actionBy === 'player' ? 'Player ' : 'Monster ' }}
            </span>

            <span
              :class="{
                'log--heal': logMessage.actionType === 'heal',
                'log--damage': logMessage.actionType !== 'heal'
              }"
            >
              {{ logMessage.actionType }} {{ logMessage.actionValue }}
            </span>
          </li>
        </ul>
      </section>
    </div>
  </body>
</html>
